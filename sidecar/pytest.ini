[pytest]
asyncio_mode = auto
# async fixture 的 event loop 用 function scope（pytest-asyncio 將來的預設）；沒設的話每次執行都會印棄用警告。
# 要用 session 等更寬 scope 的 async fixture，在 fixture 上自己寫 loop_scope
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --timeout=30
filterwarnings =
    # 沒關的資源（測試裡是 SQLite 連線）要讓測試失敗。兩條缺一不可：ResourceWarning 是物件被回收時才發的，設成 error 後
    # 例外丟不出回收的那一刻，pytest 會把它轉成 PytestUnraisableExceptionWarning——只設第一條的話全套照樣通過。
    # 第二條也會讓其他回收時丟出的例外（__del__、weakref callback 裡的）失敗，這是刻意的。
    # 紅的是回收剛好發生的那個測試，不一定是漏的那個；拖到整次執行結束才回收的，摘要仍寫全部通過、exit code 是 1，
    # 錯誤訊息沒有堆疊。到結束都還有人引用著的不會被回收，也就不會報（見 tests/conftest.py 的 test_engine）。
    # 要找連線是在哪裡開的：PYTHONTRACEMALLOC=60 .venv/bin/python -m pytest -W always::ResourceWarning <測試檔>，
    # 警告會附上配置時的堆疊（層數太少會看不到測試檔那一層）
    error::ResourceWarning
    error::pytest.PytestUnraisableExceptionWarning
    # slowapi 0.1.10（目前最新）在套用 @limiter.limit 時呼叫 asyncio.iscoroutinefunction，Python 3.14 起棄用、3.16 移除；
    # 上游修正的 PR 還沒合併。只擋這一條訊息，slowapi 之後新的棄用警告照樣看得到
    ignore:.asyncio\.iscoroutinefunction. is deprecated:DeprecationWarning:slowapi\.extension
