[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --timeout=30
filterwarnings =
    ignore::DeprecationWarning:apscheduler
    ignore::DeprecationWarning:sqlalchemy
    # slowapi 0.1.10（目前最新）在套用 @limiter.limit 時呼叫 asyncio.iscoroutinefunction，Python 3.14 起棄用、3.16 移除；
    # 上游修正的 PR 還沒合併。只擋這一條訊息，slowapi 之後新的棄用警告照樣看得到
    ignore:.asyncio\.iscoroutinefunction. is deprecated:DeprecationWarning:slowapi\.extension
