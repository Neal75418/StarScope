[pytest]
asyncio_mode = auto
# async fixture 的 event loop 用 function scope（pytest-asyncio 將來的預設）；沒設的話每次執行都會印棄用警告。
# 要用 session 等更寬 scope 的 async fixture，在 fixture 上自己寫 loop_scope
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --timeout=30
filterwarnings =
    # slowapi 0.1.10（目前最新）在套用 @limiter.limit 時呼叫 asyncio.iscoroutinefunction，Python 3.14 起棄用、3.16 移除；
    # 上游修正的 PR 還沒合併。只擋這一條訊息，slowapi 之後新的棄用警告照樣看得到
    ignore:.asyncio\.iscoroutinefunction. is deprecated:DeprecationWarning:slowapi\.extension
