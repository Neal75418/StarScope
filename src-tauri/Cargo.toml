[package]
name = "starscope"
version = "1.0.0"
description = "GitHub project intelligence desktop app"
authors = ["Neal Chen"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "starscope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
getrandom = "0.2"
# sidecar 狀態以結構傳給前端（get_sidecar_status／sidecar-status 事件）
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# 第二次開啟時叫出現有視窗：兩個 app 同時跑，第二個的 sidecar 綁不到 port，
# 它的前端會連到第一個的 sidecar、拿錯 session secret 而整片 403
tauri-plugin-single-instance = "2"

[dev-dependencies]
# 鎖住送給前端的 sidecar 狀態 JSON 格式
serde_json = "1"

[target.'cfg(unix)'.dependencies]
# cleanup_sidecar 先送 SIGTERM：onefile 的 bootloader 會轉給 Python 子行程，讓它正常關閉
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSButton", "NSControl", "NSView", "NSResponder"] }

