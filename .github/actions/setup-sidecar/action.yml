name: Setup Sidecar
description: Set up Python, install dependencies, build the onedir sidecar, smoke-test it and stage it into src-tauri/sidecar

inputs:
  target:
    description: Rust target triple（用來在包進安裝檔前檢查架構；Python 的架構由 runner 決定，這個值改不了它）
    required: true

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        # 版本以 repo 根目錄的 .python-version 為準（本機 venv、mypy 也跟它走）；這個版本會打包進安裝檔
        python-version-file: '.python-version'
        cache: 'pip'
        cache-dependency-path: sidecar/packaging.lock

    - name: Install sidecar dependencies
      shell: bash
      # 只裝 packaging.lock：執行期依賴加上 PyInstaller，版本以開發機的 constraints 為準（constraints 沒鎖的平台專屬套件
      # 取重產當下的最新版），每個檔案都要對過雜湊
      # （下載、快取或鏡像站被竄改時 pip 直接失敗）。--only-binary：從原始碼建置時抓的建置依賴不驗雜湊。
      # pip 用 setup-python 內建的那一版，不另外升級
      run: |
        pip install --require-hashes --only-binary :all: -r sidecar/packaging.lock

    # PyInstaller 預設只產出執行中架構的 binary（跨架構要所有依賴都有 fat wheel，本專案不成立），
    # 所以每個 target 都要在該架構的 runner 上打包（見 release.yml 的 matrix）
    - name: Build sidecar
      shell: bash
      working-directory: sidecar
      run: pyinstaller starscope-sidecar.spec

    # 原始碼的測試看不到打包後才會壞的問題，所以在包進安裝檔之前實際執行它
    - name: Smoke test sidecar
      shell: bash
      run: scripts/smoke-test-sidecar.sh "sidecar/dist/starscope-sidecar/starscope-sidecar${{ runner.os == 'Windows' && '.exe' || '' }}"

    # 放進 Tauri 打包的 resources：清空 repo 裡的 README，攤平 symlink（Tauri 會把指向資料夾的默默丟掉）
    - name: Stage sidecar for Tauri
      shell: bash
      run: python scripts/stage_sidecar.py sidecar/dist/starscope-sidecar src-tauri/sidecar

    # 架構錯（Intel 版在 arm64 runner 上打包）或內容不完整時，Tauri 照樣產出安裝檔
    - name: Verify the sidecar Tauri will bundle
      shell: bash
      run: python scripts/check_sidecar_binary.py src-tauri/sidecar "${{ inputs.target }}"
