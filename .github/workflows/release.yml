name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # libdbus-1-dev：tauri 2.11 起預設開 dbus feature、tao 0.35 在 Linux 直接連 libdbus-1。
          # 在 noble 上它其實會被 libwebkit2gtk-4.1-dev 的依賴鏈間接裝到，但 test.yml 從不編譯
          # Rust、第一次 Linux 編譯發生在打 tag 時，靠間接依賴等於把 release 押在別人的
          # 套件清單上——明列它（供應鏈審查 RR-D）
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup sidecar
        uses: ./.github/actions/setup-sidecar

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'StarScope ${{ github.ref_name }}'
          releaseBody: |
            See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            ## Installation

            Download the appropriate file for your platform:
            - **macOS (Intel)**: `.dmg` file for x86_64
            - **macOS (Apple Silicon)**: `.dmg` file for aarch64
            - **Windows**: `.msi` or `.exe` installer
            - **Linux**: `.AppImage` or `.deb` package
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
