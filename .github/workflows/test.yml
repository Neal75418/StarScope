name: Test

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'LICENSE'

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# CodeQL（actions/missing-workflow-permissions）：不宣告的話 GITHUB_TOKEN 拿到的是
# repo 預設的全套權限。這三個 job 只需要 checkout；artifact / cache 走 runtime token，
# 不受這裡影響。
permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./sidecar

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'sidecar/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy

      - name: Type check with mypy
        run: mypy . --config-file mypy.ini

      - name: Run tests with coverage
        run: python -m pytest tests/ -v --tb=short --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=85

      - name: Upload coverage to Codecov
        if: success() || failure()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./sidecar/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
          verbose: true

  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Bundle size budget
        run: npm run check:bundle-size

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload frontend coverage to Codecov
        if: success() || failure()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
          verbose: true

  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'sidecar/requirements.txt'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: |
          cd sidecar
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Start sidecar
        # port/資料目錄必須與 playwright.config.ts 的 E2E_* 一致。
        # 日誌導向檔案：先前 sidecar 的輸出無處可去，E2E 失敗時看不到後端
        # 發生什麼（token 有沒有讀到、GitHub 有沒有限流），只能靠猜
        run: cd sidecar && python main.py > /tmp/sidecar-e2e.log 2>&1 &
        env:
          ENV: test
          PORT: "8009"
          STARSCOPE_DATA_DIR: /tmp/starscope-e2e
          # 刻意不給 GITHUB_TOKEN。這裡試過、實測失敗（20f4f99、919706a 連兩次
          # 紅燈，POST /api/repos 一律 502）：
          #   1. routers/repos.py 的 add_repo 以 github.can_write（＝有沒有 token）
          #      決定要不要順便在 GitHub 上 star，而 star 走 PUT /user/starred/…
          #   2. Actions 內建的 GITHUB_TOKEN 是 installation token，沒有使用者身分，
          #      /user/* 端點一律被拒 → GitHubAPIError → 502
          #   3. 換成個人 PAT 更糟：那會讓 CI 真的在帳號上 star 測試用的 repo
          # 未認證的 60 次/小時足夠單次 E2E；同一小時內連推多個 commit 才會撞到，
          # 那時重跑該 job 即可（配額按小時重置）

      - name: Wait for sidecar
        # 起不來就直接失敗並附上日誌：先前迴圈跑完仍會往下走，
        # 後果是一整排看似跟 sidecar 無關的 UI 測試失敗
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8009/api/health > /dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "::error::sidecar 在 30 秒內沒有回應 /api/health"
          cat /tmp/sidecar-e2e.log || true
          exit 1

      - name: Start Vite dev server
        # 輸出導向檔案：Vite 起不來時整排 spec 都是 connection refused，先前只有 sidecar 的
        # 日誌會被印出來，會把鍋甩給後端
        run: VITE_API_URL=http://127.0.0.1:8009 npm run dev -- --port 1421 --strictPort > /tmp/vite-e2e.log 2>&1 &

      - name: Wait for Vite
        # 與 Wait for sidecar 同形：迴圈跑完仍往下走的話，失敗會被歸咎到 sidecar
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:1421 > /dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "::error::Vite 在 15 秒內沒有回應 :1421"
          cat /tmp/vite-e2e.log || true
          exit 1

      - name: Run E2E tests
        # db-mutating 也要跑：先前只指定 chromium，那三支 spec 在 CI 從未執行過
        run: npx playwright test --project=chromium --project=db-mutating

      - name: Dump sidecar log
        # E2E 的失敗多半是後端造成的（GitHub 限流、token 沒讀到、寫入失敗），
        # 但錯誤訊息只看得到前端症狀（dialog 關不掉）。失敗時直接把後端日誌印出來
        # 每個 request 都有一行 INFO，早期的錯誤大概率在 tail 200 行之外：
        # 先把錯誤、警告、traceback 篩出來，再附尾段與 Vite 的日誌；完整檔案進 artifact
        if: failure()
        run: |
          echo "::group::sidecar 錯誤／警告／traceback（全檔）"
          grep -nE "ERROR|WARNING|Traceback|GitHub" /tmp/sidecar-e2e.log || true
          echo "::endgroup::"
          echo "::group::sidecar 最後 200 行"
          tail -n 200 /tmp/sidecar-e2e.log || true
          echo "::endgroup::"
          echo "::group::vite 最後 100 行"
          tail -n 100 /tmp/vite-e2e.log || true
          echo "::endgroup::"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            /tmp/sidecar-e2e.log
            /tmp/vite-e2e.log
          retention-days: 7

