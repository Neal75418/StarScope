name: Test

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'LICENSE'

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./sidecar

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'sidecar/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy

      - name: Type check with mypy
        run: mypy . --config-file mypy.ini

      - name: Run tests with coverage
        run: python -m pytest tests/ -v --tb=short --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=85

      - name: Upload coverage to Codecov
        if: success() || failure()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./sidecar/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
          verbose: true

  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Bundle size budget
        run: npm run check:bundle-size

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload frontend coverage to Codecov
        if: success() || failure()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
          verbose: true

  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'sidecar/requirements.txt'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: |
          cd sidecar
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Start sidecar
        # port/資料目錄必須與 playwright.config.ts 的 E2E_* 一致。
        # 日誌導向檔案：先前 sidecar 的輸出無處可去，E2E 失敗時看不到後端
        # 發生什麼（token 有沒有讀到、GitHub 有沒有限流），只能靠猜
        run: cd sidecar && python main.py > /tmp/sidecar-e2e.log 2>&1 &
        env:
          ENV: test
          PORT: "8009"
          STARSCOPE_DATA_DIR: /tmp/starscope-e2e
          # E2E 會真的向 GitHub API 加 repo。未認證只有 60 次/小時，同一天
          # 多推幾個 commit 就會把配額吃光（seed 失敗、加 repo 的 dialog 關不掉）。
          # Actions 內建 token 是 1,000 次/小時；sidecar 在 DB/keyring 無 token 時
          # 會回退讀 GITHUB_TOKEN 環境變數（services/github.py 的解析順序）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for sidecar
        # 起不來就直接失敗並附上日誌：先前迴圈跑完仍會往下走，
        # 後果是一整排看似跟 sidecar 無關的 UI 測試失敗
        run: |
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:8009/api/health > /dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "::error::sidecar 在 30 秒內沒有回應 /api/health"
          cat /tmp/sidecar-e2e.log || true
          exit 1

      - name: Check GitHub token reached the sidecar
        # 只回報「有沒有」，不印出值。啟動日誌區分得出三種情況：
        # 已設定／未設定／讀取時出錯——這正是上一輪紅燈時無法判斷的事
        run: |
          if [ -n "$GITHUB_TOKEN" ]; then echo "GITHUB_TOKEN 非空: yes"; else echo "GITHUB_TOKEN 非空: no"; fi
          grep -E "\[啟動\] (未設定 )?GitHub token|\[GitHub API\] 使用" /tmp/sidecar-e2e.log || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Vite dev server
        run: VITE_API_URL=http://127.0.0.1:8009 npm run dev -- --port 1421 --strictPort &

      - name: Wait for Vite
        run: |
          for i in $(seq 1 15); do
            curl -s http://localhost:1421 > /dev/null 2>&1 && break
            sleep 1
          done

      - name: Run E2E tests
        # db-mutating 也要跑：先前只指定 chromium，那三支 spec 在 CI 從未執行過
        run: npx playwright test --project=chromium --project=db-mutating

      - name: Dump sidecar log
        # E2E 的失敗多半是後端造成的（GitHub 限流、token 沒讀到、寫入失敗），
        # 但錯誤訊息只看得到前端症狀（dialog 關不掉）。失敗時直接把後端日誌印出來
        if: failure()
        run: tail -n 200 /tmp/sidecar-e2e.log || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

