name: Verify sidecar build

# 打 tag 之前先確認每個平台都能打包出「能啟動、架構正確」的 sidecar。
# 走 release 用的同一個 composite action（打包、smoke test、架構檢查），只是不建 Tauri、不發佈。
# matrix 要與 release.yml 保持一致。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sidecar:
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # macos-latest 是 arm64；Intel 版要在 Intel runner 上打包（GitHub 公告支援到 2027-08）
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7

      - name: Build, smoke-test and verify sidecar
        uses: ./.github/actions/setup-sidecar
        with:
          target: ${{ matrix.target }}
